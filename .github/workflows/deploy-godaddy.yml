name: Deploy to GoDaddy

# Manual for now; switch to push on main (and delete web.yml) after the DNS cutover.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.7
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter test
      - run: flutter build web --release
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: build/web

  deploy:
    needs: build
    uses: kallistesoft/kallistesoft-site/.github/workflows/deploy-ftp.yml@main
    with:
      folder: snake.kallistesoft.ca
    secrets: inherit
